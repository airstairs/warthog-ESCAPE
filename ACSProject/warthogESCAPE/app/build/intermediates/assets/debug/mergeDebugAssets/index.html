<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Halo Warthog Simulator - Silent Cartographer Forest</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1410;
            font-family: sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .hud-panel {
            background: rgba(15, 30, 22, 0.75);
            border: 1px solid rgba(80, 200, 120, 0.4);
            border-radius: 8px;
            padding: 10px 15px;
            color: #7affb0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 15px rgba(50, 200, 100, 0.2);
        }
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hud-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #controls-hint {
            pointer-events: auto;
            background: rgba(15, 30, 22, 0.85);
            border: 1px solid #7affb0;
            cursor: pointer;
            font-weight: bold;
        }
        #pause-btn {
            pointer-events: auto;
            background: rgba(15, 30, 22, 0.85);
            border: 1px solid #7affb0;
            cursor: pointer;
            font-weight: bold;
        }
        #restart-btn {
            pointer-events: auto;
            background: rgba(200, 50, 50, 0.75);
            border: 1px solid #ff7a7a;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }
        
        /* Off-map Red Flash Overlay */
        #damage-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0);
            pointer-events: none;
            z-index: 140;
            transition: background 0.1s ease-in-out;
        }
        #damage-flash.flash {
            background: rgba(255, 0, 0, 0.45);
        }
        
        /* Pause Menu Styling */
        #pause-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 13, 9, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
        }
        #pause-menu.active {
            opacity: 1;
            pointer-events: auto;
        }
        .menu-box {
            background: rgba(15, 30, 22, 0.95);
            border: 2px solid rgba(80, 200, 120, 0.6);
            border-radius: 12px;
            padding: 30px 40px;
            width: 380px;
            box-shadow: 0 0 30px rgba(50, 200, 100, 0.3);
            color: #7affb0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .menu-box h2 {
            margin: 0 0 10px 0;
            text-align: center;
            letter-spacing: 2px;
        }
        .menu-control {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu-control label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .menu-control input[type="range"] {
            width: 100%;
            accent-color: #7affb0;
            cursor: pointer;
        }
        .toggle-btn {
            background: rgba(50, 200, 100, 0.4);
            border: 2px solid #7affb0;
            color: #7affb0;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(122, 255, 176, 0.4);
            transition: all 0.2s;
        }
        .toggle-btn.off {
            background: rgba(50, 50, 50, 0.3);
            border-color: rgba(100, 100, 100, 0.5);
            color: #888;
            box-shadow: none;
        }
        .menu-action-btn {
            background: rgba(80, 200, 120, 0.2);
            border: 1px solid #7affb0;
            color: #7affb0;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }
        .menu-action-btn:hover {
            background: rgba(80, 200, 120, 0.4);
        }

        #virtual-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 30px;
            box-sizing: border-box;
        }
        .control-group {
            pointer-events: auto;
            display: flex;
            gap: 15px;
        }
        .pad-group {
            display: grid;
            grid-template-columns: 70px 70px;
            grid-template-rows: 70px 70px;
            gap: 10px;
        }
        .btn {
            background: rgba(50, 200, 100, 0.15);
            border: 2px solid rgba(80, 200, 120, 0.6);
            border-radius: 50%;
            color: #7affb0;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 70px;
            height: 70px;
            touch-action: none;
            box-shadow: 0 0 10px rgba(50, 200, 100, 0.3) inset;
            transition: background 0.1s, transform 0.1s;
        }
        .btn:active, .btn.pressed {
            background: rgba(80, 200, 120, 0.4);
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(80, 200, 120, 0.6);
        }
        .btn-wide {
            border-radius: 35px;
            width: 110px;
            height: 70px;
        }
        #escape-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 215, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #0b1410;
            z-index: 200;
            font-family: sans-serif;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
        }
        #escape-screen h1 {
            font-size: 4rem;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            margin: 0 0 10px 0;
        }
        #escape-screen p {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .escape-restart-btn {
            background: #0b1410;
            border: 2px solid #0b1410;
            color: #ffd700;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s, background 0.2s;
        }
        .escape-restart-btn:hover {
            background: #1b2e22;
        }
        .escape-restart-btn:active {
            transform: scale(0.95);
        }

        /* Died Off-Map Screen Styling */
        #died-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(178, 34, 34, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            z-index: 200;
            font-family: sans-serif;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
        }
        #died-screen h1 {
            font-size: 4rem;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            margin: 0 0 10px 0;
            text-transform: lowercase;
        }
        #died-screen p {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .died-restart-btn {
            background: #0b1410;
            border: 2px solid #0b1410;
            color: #ff7a7a;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s, background 0.2s;
        }
        .died-restart-btn:hover {
            background: #2b1010;
        }
        .died-restart-btn:active {
            transform: scale(0.95);
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #060d09;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #7affb0;
            z-index: 100;
            font-family: sans-serif;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(80, 200, 120, 0.2);
            border-top: 4px solid #7affb0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="damage-flash"></div>

    <div id="loading-screen">
        <div class="spinner"></div>
        <h2>Expanding Silent Cartographer Megamap</h2>
        <p>Deploying Extraction Falcon &amp; Randomizing Drop Zone...</p>
    </div>

    <div id="escape-screen">
        <h1>YOU ESCAPED</h1>
        <p id="escape-stats">Extraction Successful!</p>
        <button class="escape-restart-btn" id="escape-restart-action-btn">Restart Warthog</button>
    </div>

    <div id="died-screen">
        <h1>shit ... you died</h1>
        <p id="died-stats">Out of Bounds</p>
        <button class="died-restart-btn" id="died-restart-action-btn">Restart Warthog</button>
    </div>

    <!-- Pause Menu Overlay -->
    <div id="pause-menu">
        <div class="menu-box">
            <h2>Simulation Settings</h2>
            <div class="menu-control">
                <label id="world-size-label">World Size: 15000</label>
                <input type="range" id="world-size-slider" min="400" max="15000" step="100" value="15000">
            </div>
            <div class="menu-control">
                <label>Extraction Beacon</label>
                <button class="toggle-btn" id="beacon-toggle-btn">HOT</button>
            </div>
            <button class="menu-action-btn" id="apply-restart-btn">Apply &amp; Restart</button>
            <button class="menu-action-btn" id="resume-btn">Resume Game</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <div id="top-bar">
            <div class="hud-group">
                <div class="hud-panel" id="speedometer">Speed: 0 MPH</div>
                <div class="hud-panel" id="timer-display">Time: 0.0s</div>
                <div class="hud-panel" id="health-display" style="color: #7affb0;">Hull Integrity: 100%</div>
            </div>
            <div class="hud-group">
                <button class="hud-panel" id="restart-btn">Restart Warthog</button>
                <button class="hud-panel" id="controls-hint">Cam: Chase</button>
                <button class="hud-panel" id="pause-btn">Pause</button>
            </div>
        </div>
    </div>

    <div id="virtual-controls">
        <div class="control-group">
            <div class="pad-group">
                <div class="btn" id="btn-left" style="grid-column: 1; grid-row: 1;">◀</div>
                <div class="btn" id="btn-right" style="grid-column: 2; grid-row: 1;">▶</div>
                <div class="btn" id="btn-brake" style="grid-column: 1/3; grid-row: 2; width: 150px; border-radius: 35px;">BRAKE</div>
            </div>
        </div>
        <div class="control-group">
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <div class="btn btn-wide" id="btn-accel" style="background: rgba(0,255,100,0.2); border-color: rgba(0,255,100,0.6); color: #00ff64;">ACCEL</div>
                <div class="btn btn-wide" id="btn-reverse" style="background: rgba(255,100,100,0.2); border-color: rgba(255,100,100,0.6); color: #ff6464;">REV</div>
            </div>
        </div>
    </div>

    <script src="three.min.js"></script>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
            }, 1000);
        });

        let scene, camera, renderer;
        let warthog;
        let wheels = [];
        let terrainGeometry;
        let fallenLogs = [];
        let trees = [];
        let boundaryFenceGroup;
        let clock = new THREE.Clock();
        let cameraMode = 0; // 0: Chase, 1: Hood, 2: Orbit

        let health = 100;
        let isDestroyed = false;
        let isEscaped = false;
        let isPaused = false;
        let fireParticles;
        let verticalVelocity = 0;
        let isAirborne = false;

        let goldenChopper;
        let extractionBeacon;
        let gameTime = 0;
        let matchActive = true;

        let MAP_SIZE = 15000;
        let beaconActive = true;

        const keys = { forward: false, backward: false, left: false, right: false, brake: false };

        const car = {
            position: new THREE.Vector3(0, 15, 0),
            rotation: 0,
            pitch: 0,
            roll: 0,
            speed: 0,
            maxSpeed: 4.8, 
            reverseSpeed: -1.5,
            acceleration: 0.07,
            braking: 0.1,
            friction: 0.985,
            steering: 0,
            maxSteer: 0.030,
            turnSpeed: 0.032
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1610);
            scene.fog = new THREE.FogExp2(0x0a1610, 0.0018);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 8000);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x2a4433, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xd4eedd, 1.1);
            sunLight.position.set(500, 1000, 500);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 10;
            sunLight.shadow.camera.far = 4000;
            const d = 800;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            buildWorld();
            createDetailedWarthog();
            createFireParticles();
            createGoldenHelicopter();
            setupTouchControls();
            setupPauseMenu();

            resetWarthog();

            window.addEventListener('resize', onWindowResize, false);
            document.getElementById('controls-hint').addEventListener('click', () => {
                cameraMode = (cameraMode + 1) % 3;
                const names = ["Cam: Chase", "Cam: Hood", "Cam: Orbit"];
                document.getElementById('controls-hint').innerText = names[cameraMode];
            });

            document.getElementById('restart-btn').addEventListener('click', resetWarthog);
            document.getElementById('escape-restart-action-btn').addEventListener('click', resetWarthog);
            document.getElementById('died-restart-action-btn').addEventListener('click', resetWarthog);

            animate();
        }

        function buildWorld() {
            createForestTerrain();
            createFallenLogs();
            createPineTrees();
            createBoundaryFence();
        }

        function clearWorld() {
            for (let log of fallenLogs) scene.remove(log.mesh);
            fallenLogs = [];
            for (let tree of trees) scene.remove(tree.mesh);
            trees = [];
            if (terrainMesh) scene.remove(terrainMesh);
            if (boundaryFenceGroup) scene.remove(boundaryFenceGroup);
        }

        let terrainMesh;
        function createForestTerrain() {
            const segments = 200;
            terrainGeometry = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE, segments, segments);
            terrainGeometry.rotateX(-Math.PI / 2);

            const pos = terrainGeometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const z = pos.getZ(i);
                let y = Math.sin(x * 0.002) * Math.cos(z * 0.002) * 120;
                y += Math.sin(x * 0.01) * Math.cos(z * 0.01) * 20;
                y += Math.sin(x * 0.0004) * 200;
                pos.setY(i, y);
            }
            terrainGeometry.computeVertexNormals();

            const terrainMat = new THREE.MeshStandardMaterial({
                color: 0x182c1f,
                roughness: 0.9,
                metalness: 0.05,
                flatShading: true
            });

            terrainMesh = new THREE.Mesh(terrainGeometry, terrainMat);
            terrainMesh.receiveShadow = true;
            scene.add(terrainMesh);
        }

        function getTerrainHeight(x, z) {
            let y = Math.sin(x * 0.002) * Math.cos(z * 0.002) * 120;
            y += Math.sin(x * 0.01) * Math.cos(z * 0.01) * 20;
            y += Math.sin(x * 0.0004) * 200;
            return y;
        }

        function createBoundaryFence() {
            boundaryFenceGroup = new THREE.Group();
            const halfSize = MAP_SIZE / 2 - 30;
            const postSpacing = 60; 

            const pylonMat = new THREE.MeshStandardMaterial({ color: 0x0f2b20, roughness: 0.4, metalness: 0.8 });
            const glowMat = new THREE.MeshBasicMaterial({ color: 0x00ffaa, transparent: true, opacity: 0.85 });
            const beamMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.45 });

            const pylonGeo = new THREE.CylinderGeometry(0.6, 0.9, 12, 6);

            const edges = [
                { start: new THREE.Vector3(-halfSize, 0, -halfSize), end: new THREE.Vector3(halfSize, 0, -halfSize) },
                { start: new THREE.Vector3(halfSize, 0, -halfSize), end: new THREE.Vector3(halfSize, 0, halfSize) },
                { start: new THREE.Vector3(halfSize, 0, halfSize), end: new THREE.Vector3(-halfSize, 0, halfSize) },
                { start: new THREE.Vector3(-halfSize, 0, halfSize), end: new THREE.Vector3(-halfSize, 0, -halfSize) }
            ];

            edges.forEach(edge => {
                const dir = new THREE.Vector3().subVectors(edge.end, edge.start);
                const length = dir.length();
                dir.normalize();

                const steps = Math.floor(length / postSpacing);
                const pointsTop = [];
                const pointsMid = [];

                for (let i = 0; i <= steps; i++) {
                    const dist = i * postSpacing;
                    const pos = new THREE.Vector3().copy(edge.start).addScaledVector(dir, dist);
                    pos.y = getTerrainHeight(pos.x, pos.z);

                    const pylon = new THREE.Mesh(pylonGeo, pylonMat);
                    pylon.position.set(pos.x, pos.y + 6, pos.z);
                    pylon.castShadow = true;
                    boundaryFenceGroup.add(pylon);

                    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), glowMat);
                    cap.position.set(pos.x, pos.y + 12, pos.z);
                    boundaryFenceGroup.add(cap);

                    pointsTop.push(new THREE.Vector3(pos.x, pos.y + 11.5, pos.z));
                    pointsMid.push(new THREE.Vector3(pos.x, pos.y + 5.5, pos.z));
                }

                const lineGeoTop = new THREE.BufferGeometry().setFromPoints(pointsTop);
                const lineTop = new THREE.Line(lineGeoTop, beamMat);
                boundaryFenceGroup.add(lineTop);

                const lineGeoMid = new THREE.BufferGeometry().setFromPoints(pointsMid);
                const lineMid = new THREE.Line(lineGeoMid, beamMat);
                boundaryFenceGroup.add(lineMid);
            });

            scene.add(boundaryFenceGroup);
        }

        function createFallenLogs() {
            const logMat = new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.85, metalness: 0.1 });
            const barkMat = new THREE.MeshStandardMaterial({ color: 0x2b1c10, roughness: 0.9, metalness: 0.05 });
            const logCount = Math.max(3, Math.floor(120 * (MAP_SIZE / 15000)));

            for (let i = 0; i < logCount; i++) {
                const radius = 0.8 + Math.random() * 1.2;
                const length = 12 + Math.random() * 18;
                const logGeom = new THREE.CylinderGeometry(radius, radius * 0.9, length, 8);
                logGeom.rotateX(Math.PI / 2);
                
                const log = new THREE.Mesh(logGeom, Math.random() > 0.5 ? logMat : barkMat);
                const boundLimit = Math.max(10, MAP_SIZE / 2 - 50);
                const lx = (Math.random() - 0.5) * boundLimit * 1.8;
                const lz = (Math.random() - 0.5) * boundLimit * 1.8;
                const ly = getTerrainHeight(lx, lz) + radius * 0.8;
                
                log.position.set(lx, ly, lz);
                log.rotation.y = Math.random() * Math.PI * 2;
                log.rotation.x += (Math.random() - 0.5) * 0.3;
                log.castShadow = true;
                log.receiveShadow = true;
                scene.add(log);

                fallenLogs.push({
                    mesh: log,
                    center: new THREE.Vector3(lx, ly, lz),
                    radius: radius + 1.2
                });
            }
        }

        function createPineTrees() {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2c1d11, roughness: 0.9 });
            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x122619, roughness: 0.8 });
            const treeCount = Math.max(5, Math.floor(500 * (MAP_SIZE / 15000)));

            for (let i = 0; i < treeCount; i++) {
                const boundLimit = Math.max(10, MAP_SIZE / 2 - 50);
                const tx = (Math.random() - 0.5) * boundLimit * 1.8;
                const tz = (Math.random() - 0.5) * boundLimit * 1.8;
                const ty = getTerrainHeight(tx, tz);
                const treeGroup = new THREE.Group();
                const scale = 0.8 + Math.random() * 1.6;

                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5 * scale, 0.8 * scale, 6 * scale, 7), trunkMat);
                trunk.position.y = (3 * scale);
                trunk.castShadow = true;
                trunk.receiveShadow = true;
                treeGroup.add(trunk);

                const c1 = new THREE.Mesh(new THREE.ConeGeometry(3.5 * scale, 6 * scale, 7), foliageMat);
                c1.position.y = 5 * scale;
                c1.castShadow = true;
                treeGroup.add(c1);

                const c2 = new THREE.Mesh(new THREE.ConeGeometry(2.8 * scale, 5 * scale, 7), foliageMat);
                c2.position.y = 8 * scale;
                c2.castShadow = true;
                treeGroup.add(c2);

                treeGroup.position.set(tx, ty, tz);
                scene.add(treeGroup);

                trees.push({
                    mesh: treeGroup,
                    center: new THREE.Vector3(tx, ty, tz),
                    radius: 2.2 * scale
                });
            }
        }

        function createDetailedWarthog() {
            warthog = new THREE.Group();

            const armorGreen = new THREE.MeshStandardMaterial({ color: 0x3b4a32, roughness: 0.5, metalness: 0.45 });
            const darkArmor = new THREE.MeshStandardMaterial({ color: 0x242d20, roughness: 0.6, metalness: 0.5 });
            const seatMat = new THREE.MeshStandardMaterial({ color: 0x151814, roughness: 0.9 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x1c2b29, roughness: 0.1, metalness: 0.85, transparent: true, opacity: 0.75 });
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x1c1e1d, roughness: 0.3, metalness: 0.85 });
            const stripeMat = new THREE.MeshStandardMaterial({ color: 0xeef2ef, roughness: 0.3 });

            const mainBody = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.75, 4.3), armorGreen);
            mainBody.position.y = 0.45;
            mainBody.castShadow = true;
            mainBody.receiveShadow = true;
            warthog.add(mainBody);

            const hoodNose = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 1.2), darkArmor);
            hoodNose.position.set(0, 0.4, 1.7);
            warthog.add(hoodNose);

            const stripe1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.52, 0.8), stripeMat);
            stripe1.position.set(-0.4, 0.42, 1.75);
            warthog.add(stripe1);
            const stripe2 = stripe1.clone();
            stripe2.position.x = -0.2;
            warthog.add(stripe2);

            const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.65, 1.3), glassMat);
            windshield.position.set(0, 1.0, 0.35);
            windshield.rotation.x = -0.32;
            warthog.add(windshield);

            const seatLeft = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 0.8), seatMat);
            seatLeft.position.set(-0.5, 0.6, 0.1);
            warthog.add(seatLeft);
            const seatRight = seatLeft.clone();
            seatRight.position.x = 0.5;
            warthog.add(seatRight);

            const cageMat = new THREE.MeshStandardMaterial({ color: 0x181a17, roughness: 0.3, metalness: 0.9 });
            const topBarGeom = new THREE.CylinderGeometry(0.06, 0.06, 3.6, 6);
            topBarGeom.rotateZ(Math.PI / 2);

            const cageLeft = new THREE.Mesh(topBarGeom, cageMat);
            cageLeft.position.set(-0.95, 1.45, 0);
            warthog.add(cageLeft);
            const cageRight = cageLeft.clone();
            cageRight.position.x = 0.95;
            warthog.add(cageRight);

            const hoopGeom = new THREE.BoxGeometry(2.0, 0.9, 0.1);
            const rearHoop = new THREE.Mesh(hoopGeom, cageMat);
            rearHoop.position.set(0, 1.0, -0.8);
            warthog.add(rearHoop);

            const turretBase = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 0.55, 10), gunMat);
            turretBase.position.set(0, 1.05, -1.1);
            turretBase.castShadow = true;
            warthog.add(turretBase);

            const gunMount = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.8), gunMat);
            gunMount.position.set(0, 1.35, -1.0);
            warthog.add(gunMount);

            const tripleBarrelGroup = new THREE.Group();
            const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.4, 8), gunMat);
            b1.rotateX(Math.PI / 2);
            b1.position.set(-0.08, 0, 0);
            const b2 = b1.clone(); b2.position.set(0.08, 0, 0);
            const b3 = b1.clone(); b3.position.set(0, 0.12, 0);
            tripleBarrelGroup.add(b1, b2, b3);
            tripleBarrelGroup.position.set(0, 1.38, -0.15);
            warthog.add(tripleBarrelGroup);

            // Correct wheel geometry orientation (cylinder axis aligned with X for proper rolling)
            const wheelGeom = new THREE.CylinderGeometry(0.58, 0.58, 0.45, 24);
            wheelGeom.rotateZ(Math.PI / 2);
            
            const tireMat = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.85 });
            const rimMat = new THREE.MeshStandardMaterial({ color: 0x3d4a32, roughness: 0.4, metalness: 0.6 });

            const wheelOffsets = [
                { x: -1.15, z: 1.45, isFront: true },
                { x: 1.15, z: 1.45, isFront: true },
                { x: -1.15, z: -1.45, isFront: false },
                { x: 1.15, z: -1.45, isFront: false }
            ];

            wheels = wheelOffsets.map(data => {
                const wheelGroup = new THREE.Group();
                const tire = new THREE.Mesh(wheelGeom, tireMat);
                tire.castShadow = true;
                wheelGroup.add(tire);

                const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.48, 12), rimMat);
                rim.rotation.z = Math.PI / 2;
                wheelGroup.add(rim);

                wheelGroup.position.set(data.x, 0.1, data.z);
                warthog.add(wheelGroup);
                return { group: wheelGroup, ...data, rotationOffset: 0 };
            });

            scene.add(warthog);
        }

        function createGoldenHelicopter() {
            goldenChopper = new THREE.Group();
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2, emissive: 0x332200 });
            const darkGold = new THREE.MeshStandardMaterial({ color: 0xb8860b, metalness: 0.7, roughness: 0.3 });

            const body = new THREE.Mesh(new THREE.SphereGeometry(2.2, 16, 16), goldMat);
            body.scale.set(1, 1.1, 2.2);
            body.castShadow = true;
            goldenChopper.add(body);

            const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.6, 5, 8), darkGold);
            tail.rotation.x = Math.PI / 2;
            tail.position.set(0, 0.5, -4.5);
            goldenChopper.add(tail);

            const rotor = new THREE.Mesh(new THREE.BoxGeometry(8, 0.1, 0.8), darkGold);
            rotor.position.set(0, 2.8, 0);
            goldenChopper.add(rotor);

            const rotorCross = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 8), darkGold);
            rotorCross.position.set(0, 2.8, 0);
            goldenChopper.add(rotorCross);

            const beaconGeom = new THREE.RingGeometry(3, 3.5, 16);
            beaconGeom.rotateX(-Math.PI / 2);
            const beaconMat = new THREE.MeshBasicMaterial({ color: 0xffea75, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
            const beacon = new THREE.Mesh(beaconGeom, beaconMat);
            beacon.position.y = -1.5;
            goldenChopper.add(beacon);

            const beamGeo = new THREE.CylinderGeometry(1.2, 3.5, 2000, 16, 1, true);
            const beamMat = new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.35, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
            extractionBeacon = new THREE.Mesh(beamGeo, beamMat);
            extractionBeacon.position.set(0, 1000, 0);
            goldenChopper.add(extractionBeacon);

            scene.add(goldenChopper);
        }

        function createFireParticles() {
            const fireGeo = new THREE.BufferGeometry();
            const fireCount = 45;
            const firePositions = new Float32Array(fireCount * 3);
            for (let i = 0; i < fireCount * 3; i++) firePositions[i] = (Math.random() - 0.5) * 0.8;
            fireGeo.setAttribute('position', new THREE.BufferAttribute(firePositions, 3));

            const fireCanvas = document.createElement('canvas');
            fireCanvas.width = 64; fireCanvas.height = 64;
            const ctx = fireCanvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,200,50,0.95)');
            grad.addColorStop(0.4, 'rgba(255,80,10,0.7)');
            grad.addColorStop(1, 'rgba(100,20,0,0)');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 64, 64);
            const fireTexture = new THREE.CanvasTexture(fireCanvas);

            const fireMat = new THREE.PointsMaterial({
                size: 1.4, map: fireTexture, transparent: true, opacity: 0.95, depthWrite: false, blending: THREE.AdditiveBlending
            });
            fireParticles = new THREE.Points(fireGeo, fireMat);
            fireParticles.position.set(0, 0.8, -1.0);
            fireParticles.visible = false;
            warthog.add(fireParticles);
        }

        function setupPauseMenu() {
            const pauseMenu = document.getElementById('pause-menu');
            const pauseBtn = document.getElementById('pause-btn');
            const resumeBtn = document.getElementById('resume-btn');
            const applyRestartBtn = document.getElementById('apply-restart-btn');
            const worldSizeSlider = document.getElementById('world-size-slider');
            const worldSizeLabel = document.getElementById('world-size-label');
            const beaconToggleBtn = document.getElementById('beacon-toggle-btn');

            worldSizeSlider.value = MAP_SIZE;
            worldSizeLabel.innerText = `World Size: ${MAP_SIZE}`;

            pauseBtn.addEventListener('click', () => {
                isPaused = true;
                pauseMenu.classList.add('active');
            });

            resumeBtn.addEventListener('click', () => {
                isPaused = false;
                pauseMenu.classList.remove('active');
            });

            worldSizeSlider.addEventListener('input', (e) => {
                const val = e.target.value;
                worldSizeLabel.innerText = `World Size: ${val}`;
            });

            beaconToggleBtn.addEventListener('click', () => {
                beaconActive = !beaconActive;
                if (beaconActive) {
                    beaconToggleBtn.innerText = "HOT";
                    beaconToggleBtn.classList.remove('off');
                } else {
                    beaconToggleBtn.innerText = "COLD";
                    beaconToggleBtn.classList.add('off');
                }
            });

            applyRestartBtn.addEventListener('click', () => {
                MAP_SIZE = parseInt(worldSizeSlider.value);
                clearWorld();
                buildWorld();
                resetWarthog();
                isPaused = false;
                pauseMenu.classList.remove('active');
            });
        }

        function resetWarthog() {
            const limit = Math.max(15, MAP_SIZE / 2 - 40);
            const rx = (Math.random() - 0.5) * limit;
            const rz = (Math.random() - 0.5) * limit;
            car.position.set(rx, getTerrainHeight(rx, rz) + 1.0, rz);
            car.rotation = Math.random() * Math.PI * 2;
            car.speed = 0;
            verticalVelocity = 0;
            isAirborne = false;

            let hx, hz, dist;
            let attempts = 0;
            do {
                hx = (Math.random() - 0.5) * limit;
                hz = (Math.random() - 0.5) * limit;
                dist = Math.hypot(hx - car.position.x, hz - car.position.z);
                attempts++;
                if (attempts > 50) break;
            } while (dist < Math.min(1000, MAP_SIZE * 0.25));

            const hy = getTerrainHeight(hx, hz) + 2.5;
            goldenChopper.position.set(hx, hy, hz);
            goldenChopper.userData.baseY = hy;

            extractionBeacon.visible = beaconActive;

            health = 100;
            isDestroyed = false;
            isEscaped = false;
            matchActive = true;
            gameTime = 0;

            fireParticles.visible = false;
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('health-display').innerText = `Hull Integrity: 100%`;
            document.getElementById('health-display').style.color = '#7affb0';
            
            const escapeScreen = document.getElementById('escape-screen');
            escapeScreen.style.opacity = '0';
            escapeScreen.style.pointerEvents = 'none';

            const diedScreen = document.getElementById('died-screen');
            diedScreen.style.opacity = '0';
            diedScreen.style.pointerEvents = 'none';
        }

        function setupTouchControls() {
            const bindButton = (id, keyName) => {
                const el = document.getElementById(id);
                const press = (e) => { e.preventDefault(); keys[keyName] = true; el.classList.add('pressed'); };
                const release = (e) => { e.preventDefault(); keys[keyName] = false; el.classList.remove('pressed'); };
                
                el.addEventListener('touchstart', press, {passive: false});
                el.addEventListener('touchend', release, {passive: false});
                el.addEventListener('touchcancel', release, {passive: false});
                el.addEventListener('mousedown', press);
                el.addEventListener('mouseup', release);
                el.addEventListener('mouseleave', release);
            };

            bindButton('btn-accel', 'forward');
            bindButton('btn-reverse', 'backward');
            bindButton('btn-left', 'left');
            bindButton('btn-right', 'right');
            bindButton('btn-brake', 'brake');

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w') keys.forward = true;
                if (e.key === 'ArrowDown' || e.key === 's') keys.backward = true;
                if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
                if (e.key === ' ') keys.brake = true;
                if (e.key === 'Escape') {
                    isPaused = !isPaused;
                    const pauseMenu = document.getElementById('pause-menu');
                    if (isPaused) pauseMenu.classList.add('active');
                    else pauseMenu.classList.remove('active');
                }
            });
            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w') keys.forward = false;
                if (e.key === 'ArrowDown' || e.key === 's') keys.backward = false;
                if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
                if (e.key === ' ') keys.brake = false;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);

            if (!isPaused) {
                if (matchActive && !isDestroyed && !isEscaped) {
                    gameTime += dt;
                    document.getElementById('timer-display').innerText = `Time: ${gameTime.toFixed(1)}s`;

                    if (keys.left) {
                        car.steering = Math.min(car.steering + car.turnSpeed, car.maxSteer);
                    } else if (keys.right) {
                        car.steering = Math.max(car.steering - car.turnSpeed, -car.maxSteer);
                    } else {
                        car.steering *= 0.85;
                    }

                    if (keys.forward) {
                        car.speed = Math.min(car.speed + car.acceleration, car.maxSpeed);
                    } else if (keys.backward) {
                        car.speed = Math.max(car.speed - car.acceleration, car.reverseSpeed);
                    } else if (keys.brake) {
                        car.speed *= (1 - car.braking);
                    } else {
                        car.speed *= car.friction;
                    }

                    if (Math.abs(car.speed) > 0.001) {
                        car.rotation += car.steering * (car.speed / car.maxSpeed) * 1.8;
                    }

                    const nextX = car.position.x + Math.sin(car.rotation) * car.speed;
                    const nextZ = car.position.z + Math.cos(car.rotation) * car.speed;

                    const mapBoundary = MAP_SIZE / 2 - 25;
                    const isOffMap = Math.abs(nextX) > mapBoundary || Math.abs(nextZ) > mapBoundary;

                    if (isOffMap) {
                        health = 0;
                        isDestroyed = true;
                        matchActive = false;
                        document.getElementById('restart-btn').style.display = 'block';
                        document.getElementById('speedometer').innerText = `Speed: 0 MPH (OUT OF BOUNDS)`;
                        document.getElementById('health-display').innerText = `Hull Integrity: 0%`;
                        document.getElementById('health-display').style.color = '#ff6464';
                        
                        const flashEl = document.getElementById('damage-flash');
                        flashEl.classList.add('flash');
                        setTimeout(() => flashEl.classList.remove('flash'), 300);

                        document.getElementById('died-stats').innerText = `Time Survived: ${gameTime.toFixed(1)}s`;
                        const diedScreen = document.getElementById('died-screen');
                        diedScreen.style.opacity = '1';
                        diedScreen.style.pointerEvents = 'auto';
                    }

                    let hitObstacle = false;
                    for (let log of fallenLogs) {
                        if (Math.hypot(nextX - log.center.x, nextZ - log.center.z) < log.radius + 1.2) {
                            hitObstacle = true;
                            break;
                        }
                    }
                    for (let tree of trees) {
                        if (Math.hypot(nextX - tree.center.x, nextZ - tree.center.z) < tree.radius + 1.0) {
                            hitObstacle = true;
                            break;
                        }
                    }

                    if (!isOffMap) {
                        if (!hitObstacle) {
                            car.position.x = nextX;
                            car.position.z = nextZ;
                        } else {
                            const impactDamage = Math.round(Math.abs(car.speed) * 16);
                            if (impactDamage > 4) {
                                health = Math.max(0, health - impactDamage);
                                document.getElementById('health-display').innerText = `Hull Integrity: ${health}%`;
                                if (health <= 68) {
                                    fireParticles.visible = true;
                                }
                                if (health <= 30) {
                                    document.getElementById('health-display').style.color = '#ff6464';
                                }
                                if (health === 0) {
                                    isDestroyed = true;
                                    matchActive = false;
                                    document.getElementById('restart-btn').style.display = 'block';
                                    document.getElementById('speedometer').innerText = `Speed: 0 MPH (DESTROYED)`;
                                }
                            }
                            car.speed *= -0.3;
                        }
                    }

                    const distToChopper = Math.hypot(car.position.x - goldenChopper.position.x, car.position.z - goldenChopper.position.z);
                    if (distToChopper < 7.5) {
                        isEscaped = true;
                        matchActive = false;
                        document.getElementById('restart-btn').style.display = 'block';
                        document.getElementById('escape-stats').innerText = `Extraction Time: ${gameTime.toFixed(1)}s | Hull Integrity: ${health}%`;
                        const escapeScreen = document.getElementById('escape-screen');
                        escapeScreen.style.opacity = '1';
                        escapeScreen.style.pointerEvents = 'auto';
                    }
                } else {
                    car.speed *= 0.9;
                }

                const groundHeight = getTerrainHeight(car.position.x, car.position.z) + 0.58;

                if (isAirborne) {
                    verticalVelocity -= 24 * dt;
                    car.position.y += verticalVelocity * dt;

                    if (car.position.y <= groundHeight) {
                        car.position.y = groundHeight;
                        isAirborne = false;
                        verticalVelocity = 0;
                    }
                } else {
                    car.position.y = groundHeight;
                    const sampleDistAhead = 3.5;
                    const aheadHeight = getTerrainHeight(
                        car.position.x + Math.sin(car.rotation) * sampleDistAhead,
                        car.position.z + Math.cos(car.rotation) * sampleDistAhead
                    );
                    const slopeUp = aheadHeight - groundHeight;

                    if (slopeUp > 0.35 && Math.abs(car.speed) > 1.8) {
                        isAirborne = true;
                        verticalVelocity = Math.abs(car.speed) * 4.2 + slopeUp * 3.0;
                    }
                }

                const sampleDist = 1.5;
                const hFront = getTerrainHeight(car.position.x + Math.sin(car.rotation) * sampleDist, car.position.z + Math.cos(car.rotation) * sampleDist);
                const hBack = getTerrainHeight(car.position.x - Math.sin(car.rotation) * sampleDist, car.position.z - Math.cos(car.rotation) * sampleDist);
                const hLeft = getTerrainHeight(car.position.x + Math.cos(car.rotation) * sampleDist, car.position.z - Math.sin(car.rotation) * sampleDist);
                const hRight = getTerrainHeight(car.position.x - Math.cos(car.rotation) * sampleDist, car.position.z + Math.sin(car.rotation) * sampleDist);

                const targetPitch = isAirborne ? car.pitch * 0.95 : Math.atan2(hFront - hBack, sampleDist * 2);
                const targetRoll = isAirborne ? 0 : Math.atan2(hRight - hLeft, sampleDist * 2);

                car.pitch = THREE.MathUtils.lerp(car.pitch, targetPitch, 0.2);
                car.roll = THREE.MathUtils.lerp(car.roll, targetRoll, 0.2);

                warthog.position.copy(car.position);
                warthog.rotation.set(0, 0, 0);
                warthog.rotation.y = car.rotation;
                warthog.rotation.x = car.pitch;
                warthog.rotation.z = car.roll;

                // Properly update wheel steering and roll angles locally within the warthog group hierarchy
                wheels.forEach(w => {
                    if (w.isFront) {
                        w.group.rotation.y = car.steering * 15;
                    }
                    w.rotationOffset -= car.speed * 1.8;
                    w.group.rotation.x = w.rotationOffset;
                });

                if (goldenChopper) {
                    const t = clock.getElapsedTime();
                    goldenChopper.position.y = goldenChopper.userData.baseY + Math.sin(t * 3) * 1.5;
                    goldenChopper.rotation.y += dt * 0.5;
                }

                if (fireParticles.visible) {
                    const fireArr = fireParticles.geometry.attributes.position.array;
                    for (let i = 1; i < fireArr.length; i += 3) {
                        fireArr[i] += dt * 3.5;
                        if (fireArr[i] > 2.2) fireArr[i] = 0;
                    }
                    fireParticles.geometry.attributes.position.needsUpdate = true;
                }

                if (matchActive && !isDestroyed) {
                    const speedMph = Math.round(Math.abs(car.speed) * 35);
                    document.getElementById('speedometer').innerText = `Speed: ${speedMph} MPH`;
                }

                if (cameraMode === 0) {
                    const offset = new THREE.Vector3(0, 4.2, -11.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), car.rotation);
                    const targetCamPos = car.position.clone().add(offset);
                    camera.position.lerp(targetCamPos, 0.15);
                    
                    const lookTarget = car.position.clone().add(new THREE.Vector3(0, 1.2, 0));
                    camera.lookAt(lookTarget);
                } else if (cameraMode === 1) {
                    const hoodOffset = new THREE.Vector3(0, 1.5, 0.8).applyAxisAngle(new THREE.Vector3(0, 1, 0), car.rotation);
                    camera.position.copy(car.position.clone().add(hoodOffset));
                    const fwd = new THREE.Vector3(Math.sin(car.rotation), 0, Math.cos(car.rotation));
                    camera.lookAt(camera.position.clone().add(fwd));
                } else {
                    const t = clock.getElapsedTime() * 0.3;
                    camera.position.set(
                        car.position.x + Math.cos(t) * 16,
                        car.position.y + 6,
                        car.position.z + Math.sin(t) * 16
                    );
                    camera.lookAt(car.position);
                }
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
